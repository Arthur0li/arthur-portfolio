<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
</head>
<body>
    <header>
        <nav>
            <div class="nav-left">
                <a id="nav-home" href="index.html"></a>
                <a id="nav-about" href="about.html"></a>
                <a id="nav-contact" href="contact.html"></a>
            </div>
            <div class="nav-right">
                <div class="logo"></div>
                <span class="user-name">Arthur</span>
                <button id="language-button">PT</button>
                <button id="theme-toggle">
                    <img src="" alt="icon theme">
                </button>
            </div>
        </nav>
    </header>
    <main>
        <section class="hero">
            <p id="hero-title"></p>
            <p id="hero-description"></p>
            <img src="" alt="icon hero" id="hero-icon">
        </section>
        <section class="projects">
            <article class="project-card">
                <img src="" alt="icon projects" id="projects-icon">
                <p id="projects-title"></p>
                <p id="projects-text"></p>
                <p id="projects-desc"></p>
                <p id="projects-tec"></p>
                <button id="live-button">
                    <img src="" alt="live icon">
                </button>
                <button id="code-button">
                    <img src="" alt="code icon">
                </button>
            </article>
        </section>

        <div id="project-modal" class="project-modal">
            <div class="modal-content">
                <button id="modal-close" class="modal-close">
                    ×
                </button>
                <header class="modal-header">
                    <span id="modal-number"></span>
                    <h2 id="modal-title"></h2>
                    <p id="modal-subtitle"></p>
                </header>
                <img id="modal-image" src="" alt="">
                <div class="modal-body">
                    <section>
                        <p id="small-title"></p>
                        <p id="modal-description"></p>
                        <ul id="modal-features"></ul>
                    </section>
                    
                    <div class="modal-actions">
                        <a
                            id="modal-demo"
                            href="#"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            ↗ <span>Live Demo</span>
                        </a>

                        <a
                            id="modal-github"
                            href="#"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            view GitHub
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <p id="footer-text">
            <span id="footer-message"></span>
            <a id="contact-link" href="contact.html"></a>
        </p>
        <div class="footer-buttons">
            <button id="linkedin">
                <img src="" alt="LinkedIn">
            </button>
            <button id="github">
                <img src="" alt="GitHub">
            </button>
            <button id="email">
                <img src="" alt="Email">
            </button>
        </div>
    </footer>   
</body>
</html>
